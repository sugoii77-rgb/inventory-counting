<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STOCK CLOUD PRO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel for Browser JSX -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        /**
         * [필독] GitHub Codespaces 터미널 사용법:
         * 1. 터미널창에 'npx serve'를 입력하고 엔터를 누르세요.
         * 2. 오른쪽 하단에 'Open in Browser' 알림이 뜨면 클릭하세요.
         * 3. 이제 브라우저에서 실시간으로 앱을 확인할 수 있습니다.
         */

        // --- Firebase Configuration ---
        // TODO: 본인의 Firebase 설정값으로 교체하세요. (설정이 없으면 클라우드 저장 기능이 작동하지 않습니다.)
        const firebaseConfig = {
            apiKey: "",
            authDomain: "",
            projectId: "",
            storageBucket: "",
            messagingSenderId: "",
            appId: ""
        };

        let db, auth, appId = "inventory-pro-app";

        try {
            if (firebaseConfig.apiKey) {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            }
        } catch (e) {
            console.error("Firebase 초기화 실패:", e);
        }

        window.FB_SERVICES = { auth, db, appId, collection, doc, setDoc, onSnapshot, deleteDoc, signInAnonymously, onAuthStateChanged };
    </script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500/30">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { 
            Upload, Plus, Minus, RotateCcw, Crosshair, Menu, X, Save, History, List, ChevronRight, Trash2, Share2, AlertCircle
        } = lucide;

        function App() {
            const [user, setUser] = useState(null);
            const [image, setImage] = useState(null);
            const [markers, setMarkers] = useState([]);
            const [selectedColor, setSelectedColor] = useState('green');
            const [pointSize, setPointSize] = useState('medium');
            const [scale, setScale] = useState(1);
            const [position, setPosition] = useState({ x: 0, y: 0 });
            const [isSidebarOpen, setIsSidebarOpen] = useState(window.innerWidth > 1024);
            const [partNumber, setPartNumber] = useState('');
            const [history, setHistory] = useState([]);
            const [activeTab, setActiveTab] = useState('tools');
            const [highlightedMarkerId, setHighlightedMarkerId] = useState(null);
            const [isSaving, setIsSaving] = useState(false);
            const [fbStatus, setFbStatus] = useState('initializing');

            const containerRef = useRef(null);
            const imageRef = useRef(null);

            const colors = {
                red: { hex: '#ef4444', label: '빨강' },
                blue: { hex: '#3b82f6', label: '파랑' },
                yellow: { hex: '#eab308', label: '노랑' },
                green: { hex: '#22c55e', label: '초록' },
            };

            const sizes = {
                small: { radius: 4, label: '소' },
                medium: { radius: 8, label: '중' },
                large: { radius: 12, label: '대' },
            };

            // Firebase Initialization & Auth
            useEffect(() => {
                const checkFB = setInterval(() => {
                    if (window.FB_SERVICES) {
                        const { auth, signInAnonymously, onAuthStateChanged } = window.FB_SERVICES;
                        if (auth) {
                            clearInterval(checkFB);
                            setFbStatus('connected');
                            signInAnonymously(auth).catch(e => setFbStatus('error'));
                            onAuthStateChanged(auth, setUser);
                        } else {
                            setFbStatus('config_missing');
                        }
                    }
                }, 1000);
                return () => clearInterval(checkFB);
            }, []);

            // Real-time History Sync
            useEffect(() => {
                if (!user || !window.FB_SERVICES || !window.FB_SERVICES.db) return;
                const { db, appId, collection, onSnapshot } = window.FB_SERVICES;
                const historyRef = collection(db, 'artifacts', appId, 'public', 'data', 'inventory_history');
                
                const unsubscribe = onSnapshot(historyRef, (snapshot) => {
                    const docs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    setHistory(docs.sort((a, b) => b.timestamp - a.timestamp).slice(0, 50));
                }, (err) => setFbStatus('error'));
                return () => unsubscribe();
            }, [user]);

            const saveToCloud = async () => {
                if (fbStatus !== 'connected') {
                    alert('Firebase 설정이 필요합니다. index.html 상단의 firebaseConfig를 확인해주세요.');
                    return;
                }
                if (!image || markers.length === 0) return;
                setIsSaving(true);
                const { db, appId, doc, setDoc } = window.FB_SERVICES;
                const docId = Date.now().toString();
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'inventory_history', docId), {
                        partNumber: partNumber || `미지정_${new Date().toLocaleTimeString()}`,
                        image, markers, timestamp: Date.now(),
                        date: new Date().toLocaleString(),
                        total: markers.length,
                    });
                    setPartNumber('');
                    alert('클라우드에 안전하게 저장되었습니다!');
                } catch (e) { alert('저장 실패: ' + e.message); }
                setIsSaving(false);
            };

            const copyUrl = () => {
                const url = window.location.href;
                const tempInput = document.createElement("input");
                document.body.appendChild(tempInput);
                tempInput.value = url;
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                alert("웹앱 주소가 복사되었습니다! 카톡에 붙여넣으세요.");
            };

            // Interactions
            const handleStart = (e) => {
                if (!image) return;
                const touches = e.touches;
                const clientX = touches ? touches[0].clientX : e.clientX;
                const clientY = touches ? touches[0].clientY : e.clientY;
                window._lastPos = { x: clientX, y: clientY };
                window._isDragging = true;
            };

            const handleMove = (e) => {
                if (!image || !window._isDragging) return;
                const touches = e.touches;
                const clientX = touches ? touches[0].clientX : e.clientX;
                const clientY = touches ? touches[0].clientY : e.clientY;
                const dx = clientX - window._lastPos.x;
                const dy = clientY - window._lastPos.y;
                setPosition(p => ({ x: p.x + dx, y: p.y + dy }));
                window._lastPos = { x: clientX, y: clientY };
            };

            const handleEnd = () => { window._isDragging = false; };

            const handleImageClick = (e) => {
                if (!imageRef.current || window._isDragging_active) return;
                const rect = imageRef.current.getBoundingClientRect();
                const clientX = e.touches ? e.changedTouches[0].clientX : e.clientX;
                const clientY = e.touches ? e.changedTouches[0].clientY : e.clientY;

                const x = ((clientX - rect.left) / scale) / rect.width * 100 * scale;
                const y = ((clientY - rect.top) / scale) / rect.height * 100 * scale;

                const newMarker = { id: Date.now(), index: markers.length + 1, x, y, color: selectedColor, size: pointSize };
                setMarkers([...markers, newMarker]);
                setHighlightedMarkerId(newMarker.id);
            };

            return (
                <div className="flex flex-col h-screen overflow-hidden bg-slate-950">
                    {/* Header */}
                    <header className="bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center z-30 shadow-xl">
                        <div className="flex items-center gap-3">
                            <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-2 lg:hidden text-slate-400 hover:text-white"><Menu size={20} /></button>
                            <div className="bg-emerald-500 p-1.5 rounded-lg hidden sm:block">
                                <Crosshair className="text-white w-5 h-5" />
                            </div>
                            <h1 className="text-sm sm:text-lg font-black text-white tracking-tight">STOCK <span className="text-emerald-400 font-black">CLOUD PRO</span></h1>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={copyUrl} className="p-2 text-slate-400 hover:text-emerald-400 transition-colors hidden sm:block">
                                <Share2 size={18} />
                            </button>
                            <label className="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer border border-slate-700 transition-all">
                                사진 선택
                                <input type="file" className="hidden" accept="image/*" onChange={(e) => {
                                    const file = e.target.files[0];
                                    if (file) {
                                        const r = new FileReader();
                                        r.onload = (f) => { setImage(f.target.result); setMarkers([]); setScale(1); setPosition({x:0, y:0}); };
                                        r.readAsDataURL(file);
                                    }
                                }} />
                            </label>
                            <button onClick={saveToCloud} disabled={isSaving || fbStatus !== 'connected'} className="bg-emerald-600 hover:bg-emerald-500 px-4 py-1.5 rounded-lg text-xs font-black text-white shadow-lg shadow-emerald-900/20 disabled:opacity-30 transition-all">
                                {isSaving ? '저장 중...' : '저장'}
                            </button>
                        </div>
                    </header>

                    <div className="flex flex-1 relative overflow-hidden">
                        {/* Sidebar */}
                        <aside className={`absolute lg:relative z-20 h-full w-72 bg-slate-900 border-r border-slate-800 transition-all duration-300 shadow-2xl ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}>
                            <div className="flex border-b border-slate-800">
                                <button onClick={() => setActiveTab('tools')} className={`flex-1 py-4 text-[11px] font-bold tracking-widest ${activeTab === 'tools' ? 'text-emerald-400 border-b-2 border-emerald-400 bg-emerald-400/5' : 'text-slate-500 hover:text-slate-300'}`}>실사 도구</button>
                                <button onClick={() => setActiveTab('history')} className={`flex-1 py-4 text-[11px] font-bold tracking-widest ${activeTab === 'history' ? 'text-emerald-400 border-b-2 border-emerald-400 bg-emerald-400/5' : 'text-slate-500 hover:text-slate-300'}`}>저장 이력 ({history.length})</button>
                            </div>
                            
                            <div className="p-5 overflow-y-auto h-[calc(100%-60px)] custom-scrollbar">
                                {activeTab === 'tools' ? (
                                    <div className="space-y-6">
                                        <section>
                                            <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 block">품번 입력</label>
                                            <input type="text" value={partNumber} onChange={e => setPartNumber(e.target.value)} placeholder="예: YC-PIPE-202" className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-white focus:ring-1 focus:ring-emerald-500 outline-none" />
                                        </section>

                                        <section>
                                            <h2 className="text-[10px] font-bold text-slate-500 uppercase mb-3 tracking-widest">포인트 설정</h2>
                                            <div className="grid grid-cols-2 gap-2 mb-3">
                                                {Object.entries(colors).map(([k, v]) => (
                                                    <button key={k} onClick={() => setSelectedColor(k)} className={`p-2 border rounded-lg flex items-center gap-2 transition-all ${selectedColor === k ? 'border-emerald-500 bg-emerald-500/10' : 'border-slate-800 hover:border-slate-600'}`}>
                                                        <span className="w-3 h-3 rounded-full" style={{backgroundColor: v.hex}}></span>
                                                        <span className="text-[10px] font-medium">{v.label}</span>
                                                    </button>
                                                ))}
                                            </div>
                                            <div className="flex bg-slate-950 p-1 rounded-lg border border-slate-800">
                                                {Object.entries(sizes).map(([k, v]) => (
                                                    <button key={k} onClick={() => setPointSize(k)} className={`flex-1 text-[10px] font-black py-1.5 rounded transition-all ${pointSize === k ? 'bg-slate-800 text-emerald-400 shadow-inner' : 'text-slate-500 hover:text-slate-300'}`}>{v.label}</button>
                                                ))}
                                            </div>
                                        </section>

                                        <section className="bg-slate-950 p-5 border border-slate-800 rounded-2xl shadow-inner">
                                            <div className="flex justify-between items-end">
                                                <span className="text-[10px] font-bold text-emerald-500 uppercase tracking-widest">현재 카운트</span>
                                                <span className="text-4xl font-black text-white leading-none">{markers.length}</span>
                                            </div>
                                        </section>

                                        <section>
                                            <h2 className="text-[10px] font-bold text-slate-500 uppercase mb-3 tracking-widest">마킹 리스트</h2>
                                            <div className="grid grid-cols-4 gap-1.5 max-h-40 overflow-y-auto pr-1">
                                                {markers.map(m => (
                                                    <button key={m.id} onClick={() => setHighlightedMarkerId(m.id)} className={`text-[9px] border rounded p-1 font-bold transition-all ${highlightedMarkerId === m.id ? 'bg-emerald-500 border-emerald-400 text-white shadow-lg shadow-emerald-900/20' : 'bg-slate-800 border-slate-700 text-slate-500 hover:border-slate-500'}`}>#{m.index}</button>
                                                ))}
                                            </div>
                                        </section>
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {history.length === 0 && (
                                            <div className="py-10 text-center text-slate-600">
                                                <AlertCircle size={24} className="mx-auto mb-2 opacity-20" />
                                                <p className="text-[10px] font-bold italic">저장된 이력이 없습니다</p>
                                            </div>
                                        )}
                                        {history.map(h => (
                                            <div key={h.id} onClick={() => loadHistoryItem(h)} className="p-3 border border-slate-800 rounded-xl flex gap-3 cursor-pointer hover:border-emerald-500/50 hover:bg-emerald-500/5 group transition-all">
                                                <div className="relative">
                                                    <img src={h.image} className="w-12 h-12 object-cover rounded-lg bg-slate-800" />
                                                    <div className="absolute -top-1 -right-1 bg-emerald-500 text-[8px] font-black px-1.5 rounded-full border border-slate-900">{h.total}</div>
                                                </div>
                                                <div className="flex-1 overflow-hidden">
                                                    <p className="text-[11px] font-black truncate text-slate-200 group-hover:text-emerald-400 transition-colors">{h.partNumber}</p>
                                                    <p className="text-[9px] text-slate-500 mt-0.5">{h.date}</p>
                                                </div>
                                                <ChevronRight size={14} className="text-slate-700 group-hover:text-emerald-500" />
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                            
                            {/* Connection Status Badge */}
                            <div className="mt-auto p-4 border-t border-slate-800 bg-slate-950/50 backdrop-blur-sm">
                                <div className="flex items-center gap-2">
                                    <div className={`w-2 h-2 rounded-full ${fbStatus === 'connected' ? 'bg-emerald-500 animate-pulse' : fbStatus === 'error' ? 'bg-red-500' : 'bg-yellow-500'}`}></div>
                                    <span className="text-[9px] font-bold text-slate-500 uppercase tracking-tighter">
                                        {fbStatus === 'connected' ? '서버 연결됨' : fbStatus === 'config_missing' ? 'Firebase 설정 필요' : '서버 확인 중...'}
                                    </span>
                                </div>
                            </div>
                        </aside>

                        {/* Main Canvas */}
                        <main className="flex-1 bg-black relative overflow-hidden touch-none" 
                              onMouseDown={handleStart} onMouseMove={handleMove} onMouseUp={handleEnd} onMouseLeave={handleEnd}
                              onTouchStart={handleStart} onTouchMove={handleMove} onTouchEnd={handleEnd}>
                            
                            {/* Zoom/Pan Guide Overlay */}
                            <div className="absolute top-4 left-4 z-10 pointer-events-none">
                                <div className="bg-black/40 backdrop-blur-md border border-white/5 px-3 py-1.5 rounded-full flex items-center gap-3">
                                    <span className="text-[10px] font-black text-white/70 tracking-widest">{scale.toFixed(1)}x ZOOM</span>
                                </div>
                            </div>

                            {image ? (
                                <div className="absolute origin-center select-none" style={{ transform: `translate(${position.x}px, ${position.y}px) scale(${scale})`, left: '50%', top: '50%', marginLeft: imageRef.current ? -imageRef.current.offsetWidth/2 : 0, marginTop: imageRef.current ? -imageRef.current.offsetHeight/2 : 0 }}>
                                    <div className="relative shadow-[0_0_100px_rgba(0,0,0,0.8)]" onClick={handleImageClick}>
                                        <img ref={imageRef} src={image} className="max-w-[95vw] max-h-[85vh] object-contain rounded-sm" />
                                        {markers.map(m => (
                                            <div key={m.id} onClick={e => { e.stopPropagation(); setHighlightedMarkerId(m.id); }} onDoubleClick={e => { e.stopPropagation(); setMarkers(markers.filter(x => x.id !== m.id)); }}
                                                 className={`absolute rounded-full border border-white/60 flex items-center justify-center transition-all duration-200 cursor-pointer ${highlightedMarkerId === m.id ? 'ring-8 ring-white/20 scale-[1.8] z-30 shadow-[0_0_20px_rgba(255,255,255,0.4)]' : 'z-20 hover:scale-125'}`}
                                                 style={{ left: `${m.x}%`, top: `${m.y}%`, width: sizes[m.size].radius*2, height: sizes[m.size].radius*2, backgroundColor: colors[m.color].hex, transform: 'translate(-50%, -50%)' }}>
                                                {highlightedMarkerId === m.id && <span className="text-[6px] font-black text-white pointer-events-none">#{m.index}</span>}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                                <div className="w-full h-full flex flex-col items-center justify-center text-slate-800">
                                    <Upload size={48} className="mb-4 opacity-5 animate-bounce" />
                                    <p className="text-sm font-black tracking-widest uppercase opacity-20 italic">사진을 선택하여 실사를 시작하세요</p>
                                </div>
                            )}

                            {/* Mobile Controls */}
                            <div className="absolute bottom-8 right-6 flex flex-col gap-3">
                                <button onClick={() => setScale(s => Math.min(s*1.4, 12))} className="w-14 h-14 bg-emerald-600 text-white rounded-2xl flex items-center justify-center shadow-2xl shadow-emerald-950/50 active:scale-90 transition-transform border border-emerald-400/50"><Plus size={24}/></button>
                                <button onClick={() => setScale(s => Math.max(s/1.4, 0.4))} className="w-14 h-14 bg-slate-800 text-white rounded-2xl flex items-center justify-center shadow-2xl shadow-black active:scale-90 transition-transform border border-slate-700/50"><Minus size={24}/></button>
                                <button onClick={() => {setScale(1); setPosition({x:0, y:0})}} className="w-14 h-14 bg-slate-900 text-slate-400 rounded-2xl flex items-center justify-center shadow-2xl active:scale-90 transition-transform border border-slate-800"><RotateCcw size={20}/></button>
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</body>
</html>
