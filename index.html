<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STOCK CLOUD PRO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel for Browser JSX -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK (Module) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- [중요] Firebase 설정값 입력 ---
        // TODO: Firebase 콘솔에서 복사한 값을 아래에 정확히 붙여넣으세요.
        const firebaseConfig = {
            apiKey: "여기에_입력",
            authDomain: "여기에_입력",
            projectId: "여기에_입력",
            storageBucket: "여기에_입력",
            messagingSenderId: "여기에_입력",
            appId: "여기에_입력"
        };

        let db, auth, appId = "inventory-pro-app";

        try {
            // apiKey가 비어있지 않고 기본값이 아닐 때만 초기화
            if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "여기에_입력") {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            }
        } catch (e) {
            console.error("Firebase 초기화 에러:", e);
        }

        // 전역 객체로 전달하여 리액트에서 사용 가능하게 함
        window.FB_SERVICES = { auth, db, appId, collection, doc, setDoc, onSnapshot, deleteDoc, signInAnonymously, onAuthStateChanged };
    </script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500/30">
    <div id="root">
        <!-- 초기 로딩 화면 -->
        <div class="h-screen w-screen flex flex-col items-center justify-center space-y-4 bg-slate-950">
            <div class="w-10 h-10 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-slate-500 text-sm font-bold tracking-widest">STOCK CLOUD PRO 로딩 중...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 아이콘 컴포넌트 직접 정의 (Lucide 의존성 제거로 에러 해결) ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Upload: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m14-7-5-5-5 5m5-5v12"/>,
                Plus: <path d="M12 5v14m-7-7h14"/>,
                Minus: <path d="M5 12h14"/>,
                RotateCcw: <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8m0-5v5h5"/>,
                Crosshair: <circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/>,
                Menu: <line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/>,
                X: <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>,
                Save: <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>,
                History: <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>,
                List: <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>,
                ChevronRight: <polyline points="9 18 15 12 9 6"/>,
                Trash2: <path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2-2v2m-6 9v6m4-6v6"/>,
                Share2: <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>,
                AlertCircle: <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        function App() {
            const [user, setUser] = useState(null);
            const [image, setImage] = useState(null);
            const [markers, setMarkers] = useState([]);
            const [selectedColor, setSelectedColor] = useState('green');
            const [pointSize, setPointSize] = useState('medium');
            const [scale, setScale] = useState(1);
            const [position, setPosition] = useState({ x: 0, y: 0 });
            const [isSidebarOpen, setIsSidebarOpen] = useState(window.innerWidth > 1024);
            const [partNumber, setPartNumber] = useState('');
            const [history, setHistory] = useState([]);
            const [activeTab, setActiveTab] = useState('tools');
            const [highlightedMarkerId, setHighlightedMarkerId] = useState(null);
            const [isSaving, setIsSaving] = useState(false);
            const [fbStatus, setFbStatus] = useState('initializing');

            const containerRef = useRef(null);
            const imageRef = useRef(null);

            const colors = {
                red: { hex: '#ef4444', label: '빨강' },
                blue: { hex: '#3b82f6', label: '파랑' },
                yellow: { hex: '#eab308', label: '노랑' },
                green: { hex: '#22c55e', label: '초록' },
            };

            const sizes = {
                small: { radius: 4, label: '소' },
                medium: { radius: 8, label: '중' },
                large: { radius: 12, label: '대' },
            };

            useEffect(() => {
                const checkFB = setInterval(() => {
                    if (window.FB_SERVICES) {
                        const { auth, signInAnonymously, onAuthStateChanged } = window.FB_SERVICES;
                        if (auth) {
                            clearInterval(checkFB);
                            setFbStatus('connected');
                            signInAnonymously(auth).catch(e => setFbStatus('error'));
                            onAuthStateChanged(auth, setUser);
                        } else {
                            setFbStatus('config_missing');
                        }
                    }
                }, 1000);
                return () => clearInterval(checkFB);
            }, []);

            useEffect(() => {
                if (!user || !window.FB_SERVICES || !window.FB_SERVICES.db) return;
                const { db, appId, collection, onSnapshot } = window.FB_SERVICES;
                const historyRef = collection(db, 'artifacts', appId, 'public', 'data', 'inventory_history');
                
                const unsubscribe = onSnapshot(historyRef, (snapshot) => {
                    const docs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    setHistory(docs.sort((a, b) => b.timestamp - a.timestamp).slice(0, 50));
                }, (err) => setFbStatus('error'));
                return () => unsubscribe();
            }, [user]);

            const saveToCloud = async () => {
                if (fbStatus !== 'connected') {
                    alert('Firebase 설정이 필요합니다. index.html 코드 상단을 확인해주세요.');
                    return;
                }
                if (!image || markers.length === 0) return;
                setIsSaving(true);
                const { db, appId, doc, setDoc } = window.FB_SERVICES;
                const docId = Date.now().toString();
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'inventory_history', docId), {
                        partNumber: partNumber || `미지정_${new Date().toLocaleTimeString()}`,
                        image, markers, timestamp: Date.now(),
                        date: new Date().toLocaleString(),
                        total: markers.length,
                    });
                    setPartNumber('');
                    alert('클라우드 저장 성공!');
                } catch (e) { alert('저장 실패: ' + e.message); }
                setIsSaving(false);
            };

            // Interactions
            const handleStart = (e) => {
                if (!image) return;
                const touches = e.touches;
                const clientX = touches ? touches[0].clientX : e.clientX;
                const clientY = touches ? touches[0].clientY : e.clientY;
                window._lastPos = { x: clientX, y: clientY };
                window._isDragging = true;
            };

            const handleMove = (e) => {
                if (!image || !window._isDragging) return;
                const touches = e.touches;
                const clientX = touches ? touches[0].clientX : e.clientX;
                const clientY = touches ? touches[0].clientY : e.clientY;
                const dx = clientX - window._lastPos.x;
                const dy = clientY - window._lastPos.y;
                setPosition(p => ({ x: p.x + dx, y: p.y + dy }));
                window._lastPos = { x: clientX, y: clientY };
            };

            const handleEnd = () => { window._isDragging = false; };

            const handleImageClick = (e) => {
                if (!imageRef.current) return;
                const rect = imageRef.current.getBoundingClientRect();
                const clientX = e.touches ? e.changedTouches[0].clientX : e.clientX;
                const clientY = e.touches ? e.changedTouches[0].clientY : e.clientY;

                const x = ((clientX - rect.left) / scale) / rect.width * 100 * scale;
                const y = ((clientY - rect.top) / scale) / rect.height * 100 * scale;

                const newMarker = { id: Date.now(), index: markers.length + 1, x, y, color: selectedColor, size: pointSize };
                setMarkers([...markers, newMarker]);
                setHighlightedMarkerId(newMarker.id);
            };

            const counts = markers.reduce((acc, curr) => {
                acc[curr.color] = (acc[curr.color] || 0) + 1;
                return acc;
            }, {});

            return (
                <div className="flex flex-col h-screen overflow-hidden bg-slate-950">
                    <header className="bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center z-30 shadow-xl">
                        <div className="flex items-center gap-3">
                            <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-2 lg:hidden text-slate-400"><Icon name="Menu" /></button>
                            <h1 className="text-sm sm:text-lg font-black text-white">STOCK <span className="text-emerald-400">CLOUD PRO</span></h1>
                        </div>
                        <div className="flex gap-2">
                            <label className="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer border border-slate-700">
                                사진 선택
                                <input type="file" className="hidden" accept="image/*" onChange={(e) => {
                                    const file = e.target.files[0];
                                    if (file) {
                                        const r = new FileReader();
                                        r.onload = (f) => { setImage(f.target.result); setMarkers([]); setScale(1); setPosition({x:0, y:0}); };
                                        r.readAsDataURL(file);
                                    }
                                }} />
                            </label>
                            <button onClick={saveToCloud} disabled={isSaving || fbStatus !== 'connected'} className="bg-emerald-600 hover:bg-emerald-500 px-4 py-1.5 rounded-lg text-xs font-black text-white shadow-lg disabled:opacity-30">
                                {isSaving ? '저장 중...' : '저장'}
                            </button>
                        </div>
                    </header>

                    <div className="flex flex-1 relative overflow-hidden">
                        <aside className={`absolute lg:relative z-20 h-full w-72 bg-slate-900 border-r border-slate-800 transition-all duration-300 shadow-2xl ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}>
                            <div className="flex border-b border-slate-800 text-center">
                                <button onClick={() => setActiveTab('tools')} className={`flex-1 py-4 text-[11px] font-bold ${activeTab === 'tools' ? 'text-emerald-400 border-b-2 border-emerald-400' : 'text-slate-500'}`}>실사 도구</button>
                                <button onClick={() => setActiveTab('history')} className={`flex-1 py-4 text-[11px] font-bold ${activeTab === 'history' ? 'text-emerald-400 border-b-2 border-emerald-400' : 'text-slate-500'}`}>이력 ({history.length})</button>
                            </div>
                            
                            <div className="p-5 overflow-y-auto h-[calc(100%-60px)] custom-scrollbar">
                                {activeTab === 'tools' ? (
                                    <div className="space-y-6">
                                        <section>
                                            <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 block">품번 입력</label>
                                            <input type="text" value={partNumber} onChange={e => setPartNumber(e.target.value)} placeholder="예: YC-PIPE-202" className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-white focus:ring-1 focus:ring-emerald-500 outline-none" />
                                        </section>

                                        <section>
                                            <h2 className="text-[10px] font-bold text-slate-500 uppercase mb-3 tracking-widest">포인트 설정</h2>
                                            <div className="grid grid-cols-2 gap-2 mb-3">
                                                {Object.entries(colors).map(([k, v]) => (
                                                    <button key={k} onClick={() => setSelectedColor(k)} className={`p-2 border rounded-lg flex items-center gap-2 ${selectedColor === k ? 'border-emerald-500 bg-emerald-500/10' : 'border-slate-800'}`}>
                                                        <span className="w-3 h-3 rounded-full" style={{backgroundColor: v.hex}}></span>
                                                        <span className="text-[10px]">{v.label}</span>
                                                    </button>
                                                ))}
                                            </div>
                                            <div className="flex bg-slate-950 p-1 rounded-lg border border-slate-800">
                                                {Object.entries(sizes).map(([k, v]) => (
                                                    <button key={k} onClick={() => setPointSize(k)} className={`flex-1 text-[10px] font-black py-1.5 rounded ${pointSize === k ? 'bg-slate-800 text-emerald-400' : 'text-slate-500'}`}>{v.label}</button>
                                                ))}
                                            </div>
                                        </section>

                                        <div className="bg-slate-950 p-5 border border-slate-800 rounded-2xl">
                                            <div className="flex justify-between items-end">
                                                <span className="text-[10px] font-bold text-emerald-500 tracking-widest">현재 카운트</span>
                                                <span className="text-4xl font-black">{markers.length}</span>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-4 gap-1.5">
                                            {markers.map(m => (
                                                <button key={m.id} onClick={() => setHighlightedMarkerId(m.id)} className={`text-[9px] border rounded p-1 font-bold ${highlightedMarkerId === m.id ? 'bg-emerald-500 border-emerald-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>#{m.index}</button>
                                            ))}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {history.length === 0 && <p className="text-[10px] text-center text-slate-600 italic py-10">기록이 없습니다.</p>}
                                        {history.map(h => (
                                            <div key={h.id} onClick={() => { setImage(h.image); setMarkers(h.markers); setPartNumber(h.partNumber); setActiveTab('tools'); }} className="p-3 border border-slate-800 rounded-xl flex gap-3 cursor-pointer hover:border-emerald-500/50">
                                                <img src={h.image} className="w-12 h-12 object-cover rounded-lg bg-slate-800" />
                                                <div className="flex-1 min-w-0">
                                                    <p className="text-[11px] font-black truncate">{h.partNumber}</p>
                                                    <p className="text-[9px] text-slate-500">{h.date} | {h.total}개</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                            
                            <div className="mt-auto p-4 border-t border-slate-800 bg-slate-950/50 text-[9px] font-bold text-slate-500 flex items-center gap-2">
                                <div className={`w-2 h-2 rounded-full ${fbStatus === 'connected' ? 'bg-emerald-500 animate-pulse' : 'bg-red-500'}`}></div>
                                {fbStatus === 'connected' ? '서버 연결 완료' : '설정값 확인 필요'}
                            </div>
                        </aside>

                        <main className="flex-1 bg-black relative overflow-hidden touch-none" 
                              onMouseDown={handleStart} onMouseMove={handleMove} onMouseUp={handleEnd} onMouseLeave={handleEnd}
                              onTouchStart={handleStart} onTouchMove={handleMove} onTouchEnd={handleEnd}>
                            
                            {image ? (
                                <div className="absolute origin-center select-none" style={{ transform: `translate(${position.x}px, ${position.y}px) scale(${scale})`, left: '50%', top: '50%', marginLeft: imageRef.current ? -imageRef.current.offsetWidth/2 : 0, marginTop: imageRef.current ? -imageRef.current.offsetHeight/2 : 0 }}>
                                    <div className="relative shadow-2xl" onClick={handleImageClick}>
                                        <img ref={imageRef} src={image} className="max-w-[95vw] max-h-[85vh] object-contain rounded-sm" />
                                        {markers.map(m => (
                                            <div key={m.id} onClick={e => { e.stopPropagation(); setHighlightedMarkerId(m.id); }} onDoubleClick={e => { e.stopPropagation(); setMarkers(markers.filter(x => x.id !== m.id)); }}
                                                 className={`absolute rounded-full border border-white/60 flex items-center justify-center transition-all ${highlightedMarkerId === m.id ? 'ring-8 ring-white/20 scale-150 z-30' : 'z-20'}`}
                                                 style={{ left: `${m.x}%`, top: `${m.y}%`, width: sizes[m.size].radius*2, height: sizes[m.size].radius*2, backgroundColor: colors[m.color].hex, transform: 'translate(-50%, -50%)' }}>
                                                {highlightedMarkerId === m.id && <span className="text-[6px] font-black text-white pointer-events-none">#{m.index}</span>}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                                <div className="w-full h-full flex flex-col items-center justify-center opacity-20">
                                    <Icon name="Upload" size={48} className="mb-4" />
                                    <p className="text-sm font-black tracking-widest uppercase italic">사진을 선택하여 시작하세요</p>
                                </div>
                            )}

                            <div className="absolute bottom-8 right-6 flex flex-col gap-3">
                                <button onClick={() => setScale(s => Math.min(s*1.4, 12))} className="w-14 h-14 bg-emerald-600 rounded-2xl flex items-center justify-center shadow-2xl"><Icon name="Plus" size={24}/></button>
                                <button onClick={() => setScale(s => Math.max(s/1.4, 0.4))} className="w-14 h-14 bg-slate-800 rounded-2xl flex items-center justify-center shadow-2xl"><Icon name="Minus" size={24}/></button>
                                <button onClick={() => {setScale(1); setPosition({x:0, y:0})}} className="w-14 h-14 bg-slate-900 rounded-2xl flex items-center justify-center border border-slate-800"><Icon name="RotateCcw" size={20}/></button>
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</body>
</html>
